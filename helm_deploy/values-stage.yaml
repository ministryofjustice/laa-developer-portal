---
# Per environment values which override defaults in laa-developer-portal/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: developer-portal-stage.laa.service.justice.gov.uk
    tlsSecretName: laa-developer-portal-stage-cert

  env:
    INGRESS_URL: "https://developer-portal-stage.laa.service.justice.gov.uk"
    SERVICE_CATALOGUE_URL: "https://service-catalogue-dev.laa.service.justice.gov.uk"
    NODE_ENV: "stage"
    RECOMMENDED_VERSIONS_TTL_MS: "21600000"
    LAA_TEMPLATE_COMPONENT_NAME: "laa-template-kotlin"
    RECOMMENDED_VERSIONS_KOTLIN_ONLY: "true"

  namespace_secrets:
    elasticache-redis:
      REDIS_HOST: "primary_endpoint_address"
      REDIS_AUTH_TOKEN: "auth_token"

generic-prometheus-alerts:
  targetApplication: laa-developer-portal-stage
  alertSeverity: laa-sre-alerts-nonprod
