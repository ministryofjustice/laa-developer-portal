---
generic-service:
  nameOverride: laa-developer-portal
  productId: 'DPS000'

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/laa-developer-portal
    tag: app_version # override at deployment time
    port: 3000

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: laa-developer-portal-cert

  livenessProbe:
    httpGet:
      path: /ping

  readinessProbe:
    httpGet:
      path: /ping

  # Environment variables to load into the deployment
  env:
    NODE_ENV: 'production'
    REDIS_TLS_ENABLED: 'true'
    ALERTMANAGER_URL: "http://monitoring-alerts-service.cloud-platform-monitoring-alerts:8080/alertmanager"
    SLACK_WORKSPACE_ID: "T02DYEB3A"

  # Pre-existing kubernetes secrets to load as environment variables in the deployment.
  # namespace_secrets:
  #   [name of kubernetes secret]:
  #     [name of environment variable as seen by app]: [key of kubernetes secret to load]

  namespace_secrets:
    laa-developer-portal:
      APPLICATIONINSIGHTS_CONNECTION_STRING: 'APPLICATIONINSIGHTS_CONNECTION_STRING'
      SESSION_SECRET: 'SESSION_SECRET'
      SERVICE_CATALOGUE_TOKEN: 'SERVICE_CATALOGUE_TOKEN'

  allowlist:
    groups:
      - internal
      - prisons
      - unilink_staff

generic-prometheus-alerts:
  targetApplication: laa-developer-portal
